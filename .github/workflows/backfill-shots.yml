# 슛 차트 백필 — 서버 C(api.kbl.or.kr)의 경기별 슛 좌표를 과거 시즌까지 한 번 받는다 (scripts/backfill-shots.ts).
# 시즌마다: 경기 목록 월별 10회(→ data/raw/games/{시즌}/list.json) + 끝난 정규시즌 경기 약 270회(→ data/raw/shots/{시즌}/{gmkey}.json).
# 요청 간격 1.5초 → 시즌당 약 7분, 30개 시즌이면 약 3.5시간. (정확한 수: npm run backfill:shots -- --count)
#
# 실행 방법: 아래 "실행 횟수" 숫자를 1 올려서 main 에 푸시 (0 이면 파일이 푸시돼도 아무것도 받지 않는다)
#   (GitHub → Actions → "슛 차트 백필" → Run workflow 버튼도 된다 — 이때는 숫자와 관계없이 실행)
# 대상 시즌 지정: 아래 "대상 시즌" 줄(맨 아래 주석 줄)에 시즌 코드를 공백으로 적으면 그 시즌만 (예: 47 45), 비우면 선수 raw 가 있는 전체 시즌(최신 먼저).
#   처음에는 47 한 시즌으로 좌표 형식을 확인한 뒤 비워서 전체를 받는 것을 권한다.
# 이어받기: 이미 raw 가 있는 경기는 건너뛰고, 시즌 하나가 끝날 때마다 커밋·푸시한다.
#   시간 예산(300분)에 걸리거나 실패가 남으면 숫자를 한 번 더 올려 푸시하면 남은 것만 받는다.
#
# 실행 횟수: 4
# 대상 시즌:
name: 슛 차트 백필

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-shots.yml"

permissions:
  contents: write

concurrency:
  group: fetch          # 매일 수집·다른 백필과 동시에 돌지 않게 같은 그룹
  cancel-in-progress: false

jobs:
  backfill-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (판 고정, 2026-10-03 보안 점검)

      - name: 실행 횟수 확인 (0 이면 건너뜀)
        id: gate
        run: |
          n=$(grep -m1 -oE '^# 실행 횟수: [0-9]+' .github/workflows/backfill-shots.yml | grep -oE '[0-9]+$' || echo 0)
          echo "실행 횟수: $n (이벤트: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$n" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::실행 횟수가 0 이라 백필하지 않습니다. 숫자를 1 올려 푸시하면 실행됩니다."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: 시즌별 수집·커밋
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          seasons=$(grep -m1 -E '^# 대상 시즌:'  .github/workflows/backfill-shots.yml | sed -E 's/^# 대상 시즌:[[:space:]]*//' | grep -oE '[0-9]+' | tr '\n' ' ' || true)
          if [ -z "${seasons// /}" ]; then
            seasons=$(npx tsx scripts/backfill-shots.ts --list-seasons)
            echo "대상 시즌(전체): $seasons"
          else
            echo "대상 시즌(지정): $seasons"
          fi
          npx tsx scripts/backfill-shots.ts --count
          # 시간 제한(350분) 전에 새 시즌을 시작하지 않도록 300분 예산 — 한 시즌은 약 7분
          deadline=$(( $(date +%s) + 300 * 60 ))
          failed=""
          for s in $seasons; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::시간 예산을 다 써서 시즌 $s 부터는 다음 실행으로 넘깁니다 (실행 횟수를 올려 다시 푸시)"
              break
            fi
            npx tsx scripts/backfill-shots.ts --season "$s" || failed="$failed $s"
            [ -d data/raw/games ] && git add data/raw/games
            [ -d data/raw/shots ] && git add data/raw/shots
            if ! git diff --cached --quiet; then
              git commit -q -m "데이터 백필: 슛 차트 시즌 $s"
              git pull -q --rebase origin main
              git push -q
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning::일부 실패가 남은 시즌:$failed — 실행 횟수를 올려 다시 푸시하면 남은 것만 받습니다"
          fi
          [ -d data/raw/shots ] && du -sh data/raw/shots || true
