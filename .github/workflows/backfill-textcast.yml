# 문자중계 백필 — 서버 C(api.kbl.or.kr)의 경기별 문자중계 중 4쿼터·연장을 과거 시즌까지 한 번 받는다 (scripts/backfill-textcast.ts, 2026-10-28 클러치·위닝샷).
# 시즌마다: 끝난 정규시즌 약 270경기 + 플레이오프·챔프전 약 20경기(2026-10-28 추가) × 보통 1회(연장 경기는 2~3회) → data/raw/textcast/{시즌}/{gmkey}.json. 경기 목록은 슛 차트 백필이 받아 둔 것.
# 요청 간격 1.5초 → 시즌당 약 7~8분, 2006-07(코드 11)~ 약 21개 시즌이면 약 2.7시간. (정확한 수: npm run backfill:textcast -- --count)
#
# 실행 방법: 아래 "실행 횟수" 숫자를 1 올려서 main 에 푸시 (0 이면 파일이 푸시돼도 아무것도 받지 않는다)
#   (GitHub → Actions → "문자중계 백필" → Run workflow 버튼도 된다 — 이때는 숫자와 관계없이 실행)
# 대상 시즌 지정: 아래 "대상 시즌" 줄(맨 아래 주석 줄)에 시즌 코드를 공백으로 적으면 그 시즌만 (예: 47 45), 비우면 경기 목록이 있는 2006-07 이후 전체(최신 먼저).
# 이어받기: 이미 raw 가 있는 경기는 건너뛰고, 시즌 하나가 끝날 때마다 data-backfill 브랜치에 중간 저장, 맨 끝에 main 에 한 번 반영(+ 가공).
#   시간 예산(300분)에 걸리거나 실패가 남으면 숫자를 한 번 더 올려 푸시하면 남은 것만 받는다.
#
# 실행 횟수: 2
# 대상 시즌:
name: 문자중계 백필

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-textcast.yml"

permissions:
  contents: write

concurrency:
  group: fetch          # 매일 수집·다른 백필과 동시에 돌지 않게 같은 그룹
  cancel-in-progress: false

jobs:
  backfill-textcast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (판 고정, 2026-10-03 보안 점검)
        with:
          fetch-depth: 0   # data-backfill 브랜치 이어받기·main 위에 rebase 에 공통 조상이 필요하다 (2026-10-05)

      - name: 실행 횟수 확인 (0 이면 건너뜀)
        id: gate
        run: |
          n=$(grep -m1 -oE '^# 실행 횟수: [0-9]+' .github/workflows/backfill-textcast.yml | grep -oE '[0-9]+$' || echo 0)
          echo "실행 횟수: $n (이벤트: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$n" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::실행 횟수가 0 이라 백필하지 않습니다. 숫자를 1 올려 푸시하면 실행됩니다."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: 시즌별 수집·커밋
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          # 시즌마다 main 에 푸시하지 않는다 — 커밋마다 Vercel 배포(소스 스냅샷 약 260MB)가 생겨 저장공간 한도(10GB)를 넘겼다(2026-09-30).
          # 중간 저장은 data-backfill 브랜치(vercel.json 이 main 만 배포하므로 배포 안 함), main 에는 맨 끝 단계에서 한 번만.
          # 지난 실행이 중간에 끊겼으면 그 브랜치에 남은 raw 를 이어받는다(같은 파일이 겹치면 main 쪽을 둔다).
          git checkout -q -B data-backfill
          if git fetch -q origin data-backfill 2>/dev/null; then
            git merge -q --no-edit -X ours origin/data-backfill || { git merge --abort; echo "::warning::data-backfill 이어받기 실패 — 처음부터 받습니다"; }
          fi
          seasons=$(grep -m1 -E '^# 대상 시즌:'  .github/workflows/backfill-textcast.yml | sed -E 's/^# 대상 시즌:[[:space:]]*//' | grep -oE '[0-9]+' | tr '\n' ' ' || true)
          if [ -z "${seasons// /}" ]; then
            seasons=$(npx tsx scripts/backfill-textcast.ts --list-seasons)
            echo "대상 시즌(전체): $seasons"
          else
            echo "대상 시즌(지정): $seasons"
          fi
          npx tsx scripts/backfill-textcast.ts --count
          # 시간 제한(350분) 전에 새 시즌을 시작하지 않도록 300분 예산 — 한 시즌은 약 8분
          deadline=$(( $(date +%s) + 300 * 60 ))
          failed=""
          for s in $seasons; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::시간 예산을 다 써서 시즌 $s 부터는 다음 실행으로 넘깁니다 (실행 횟수를 올려 다시 푸시)"
              break
            fi
            npx tsx scripts/backfill-textcast.ts --season "$s" || failed="$failed $s"
            [ -d data/raw/textcast ] && git add data/raw/textcast
            if ! git diff --cached --quiet; then
              git commit -q -m "데이터 백필: 문자중계 시즌 $s"
              git push -q -f origin HEAD:data-backfill
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning::일부 실패가 남은 시즌:$failed — 실행 횟수를 올려 다시 푸시하면 남은 것만 받습니다"
          fi
          [ -d data/raw/textcast ] && du -sh data/raw/textcast || true

      - name: 가공 (클러치·위닝샷 → data/processed)
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          npm run process
          git add data/processed
          git diff --cached --quiet || git commit -q -m "데이터 가공: 클러치·위닝샷"

      - name: main 에 반영 (배포 한 번)
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          # 이번 실행의 모든 데이터 커밋을 최신 main 위에 얹어 한 번에 푸시 → Vercel 배포 1회. 겹치는 데이터 파일은 방금 받은 쪽(-X theirs).
          git fetch -q origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
          git push -q origin --delete data-backfill || true
