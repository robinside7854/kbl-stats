# 과거 시즌 전체 재수집 (백필)
# 실행 방법 두 가지:
#   1) GitHub → Actions → "KBL 전체 시즌 백필" → Run workflow
#   2) 이 파일의 아래 "실행 횟수" 숫자를 1 올려서 푸시 (버튼을 누를 수 없는 환경용)
#
# 실행 횟수: 3   (3: 2026-10-03 플레이오프·챔프전 시즌 합계 첫 수집)
name: KBL 전체 시즌 백필

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill.yml"

permissions:
  contents: write

concurrency:
  group: fetch          # 매일 수집(fetch.yml)과 동시에 돌지 않게 같은 그룹
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (판 고정, 2026-10-03 보안 점검)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 전체 시즌 수집
        run: npm run fetch:all
      - name: 가공
        if: always()
        run: npm run process
      - name: 커밋
        if: always()
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 백필: 전체 시즌 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
