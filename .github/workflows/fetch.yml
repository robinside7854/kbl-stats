# 매일 밤 KBL 기록을 수집해 data/ 에 커밋한다 (그날 경기를 그날 밤 반영).
# 수동 실행: GitHub → Actions → "KBL 기록 수집" → Run workflow
# 시즌 기록 뒤에 현재 시즌 선수의 한 경기 최다·경기별 기록·프로필도 받는다(약 200명 × 3회, 1.5초 간격 ≈ 15분,
# 개막 후 30일 동안은 직전 시즌 선수도(≈ 30분) — scripts/highs.ts highsTargetSeasons). 과거는 backfill-highs.yml·backfill-gamelogs.yml.
# 슛 차트(서버 C): 같은 대상 시즌의 경기 목록(1~10회) + 새로 끝난 정규시즌 경기(보통 하루 0~5회, 1분 안쪽).
#   백필 전 첫 실행은 그 시즌 약 270경기를 한꺼번에 받아 약 7분 더 걸린다 — 90분 제한 안. 과거는 backfill-shots.yml.
name: KBL 기록 수집

on:
  schedule:
    # 매일 23:40 KST (= 14:40 UTC). 평일 19시 경기도 21시 전후에 끝나고, 개막일(2026-10-03) 14시 경기는
    #   그날 19시 반에 KBL 서버 3곳(선수 기록·경기별 기록·슛 차트)에 다 들어와 있었다 → 그날 밤 반영.
    #   GitHub 스케줄은 수십 분 늦게 돌기도 하지만 자정 넘어도 수집 대상 날짜(todayKst)와 무관하다.
    #   (2026-10-03 사용자 요청: 다음날 새벽 04:10 → 당일 밤)
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "수집할 시즌 코드 (공백 구분, 비우면 기본값, all 이면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 수집
        run: |
          if [ "${{ github.event.inputs.seasons }}" = "all" ]; then
            npm run fetch:all
          elif [ -n "${{ github.event.inputs.seasons }}" ]; then
            npm run fetch -- ${{ github.event.inputs.seasons }}
          else
            npm run fetch
          fi

      - name: 가공
        if: always()
        run: npm run process

      - name: 커밋
        if: always()
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
