# 매일 그날 경기가 끝난 뒤 KBL 기록을 수집해 data/ 에 커밋한다 (그날 경기를 그날 저녁·밤 반영).
# 수동 실행: GitHub → Actions → "KBL 기록 수집" → Run workflow
# 시즌 기록 뒤에 현재 시즌 선수의 한 경기 최다·경기별 기록·프로필도 받는다(약 200명 × 3회, 1.5초 간격 ≈ 15분,
# 개막 후 30일 동안은 직전 시즌 선수도(≈ 30분) — scripts/highs.ts highsTargetSeasons). 과거는 backfill-highs.yml·backfill-gamelogs.yml.
# 슛 차트(서버 C): 같은 대상 시즌의 경기 목록(시즌 전체 달 약 10회 — 일정 화면 "일정", 2026-10-03) + 새로 끝난 정규시즌 경기(보통 하루 0~5회, 1분 안쪽).
#   백필 전 첫 실행은 그 시즌 약 270경기를 한꺼번에 받아 약 7분 더 걸린다 — 90분 제한 안. 과거는 backfill-shots.yml.
name: KBL 기록 수집

on:
  schedule:
    # 저녁 18:10~23:40 KST 사이 30분마다 깨우고, 문지기(scripts/fetch-gate.ts)가 그날 경기가 다 끝났는지 보고 하루 한 번만 수집한다
    # (2026-10-03 사용자 요청: 주말·공휴일 낮 경기와 평일 저녁 경기 시간이 달라서).
    #   - 오늘 경기가 모두 끝나고 1시간 지났으면 그다음 깨어난 때 수집 (주말 낮 경기 → 저녁 7~8시대, 평일 19시 경기 → 밤 10시대)
    #   - 경기 없는 날·늦게 끝난 날은 23시 이후 첫 깨어남에 수집 (자정을 넘겨 늦게 돌아도 그날 몫)
    # 2026-10-04: GitHub 예약 실행이 1~3시간씩 밀려(10-04 18:40 실행이 19:40 까지 시작 안 함) 네 번 → 열두 번으로 늘림.
    #   깨울 때마다 npm ci + 경기 목록 요청 1회만 하고(수집이 끝난 날은 그마저 하지 않음), 수집은 하루 1회.
    - cron: "10,40 9-14 * * *"   # 18:10, 18:40 … 23:10, 23:40 KST
  # 이 파일을 main 에 푸시하면 바로 한 번 수집한다 (Claude 세션은 Run workflow 버튼 권한이 없어서)
  push:
    branches: [main]
    paths: [".github/workflows/fetch.yml"]
  workflow_dispatch:
    inputs:
      seasons:
        description: "수집할 시즌 코드 (공백 구분, 비우면 기본값, all 이면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (판 고정, 2026-10-03 보안 점검)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 오늘 수집할지 (경기 종료 확인)
        id: gate
        env:
          FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: npx tsx scripts/fetch-gate.ts check

      - name: 수집
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ github.event.inputs.seasons }}" = "all" ]; then
            npm run fetch:all
          elif [ -n "${{ github.event.inputs.seasons }}" ]; then
            npm run fetch -- ${{ github.event.inputs.seasons }}
          else
            npm run fetch
          fi

      - name: 수집 기록
        if: steps.gate.outputs.mark == 'true' && success()
        run: npx tsx scripts/fetch-gate.ts mark

      - name: 가공
        if: always() && steps.gate.outputs.run == 'true'
        run: npm run process

      - name: 커밋
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 수집 중에 main 에 다른 커밋(배포·백필)이 들어와 있으면 그대로 push 가 거부된다(2026-10-03 실제로 실패).
            # 최신 main 위에 이 데이터 커밋을 다시 얹고(겹치는 데이터 파일은 방금 받은 쪽 -X theirs) 올린다. 3번까지 다시 시도
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then exit 0; fi
              echo "push 실패 — ${i}번째, 다시 시도"
              sleep 10
            done
            exit 1
          fi
