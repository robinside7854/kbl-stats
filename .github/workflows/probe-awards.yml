# 조사용 1회 워크플로 — KBL 공홈 역대수상현황(/record/award) 데이터가 든 JS 번들을 받아 이 브랜치에 커밋 (세션 환경은 kbl.or.kr 차단). 확인 후 삭제.
name: KBL 수상 기록 주소 조사
on:
  push:
    branches: [claude/probe-awards]
    paths: [.github/workflows/probe-awards.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 번들 받기
        run: |
          UA="Mozilla/5.0"
          curl --max-time 20 -sL -A "$UA" https://kbl.or.kr/record/award -o page.html
          src=$(grep -oE 'src="/assets/index-[^"]*\.js"' page.html | head -1 | sed -E 's/src="([^"]*)"/\1/')
          echo "bundle: $src"
          mkdir -p probe
          curl --max-time 60 -sL -A "$UA" "https://kbl.or.kr$src" -o probe/bundle.js
          ls -la probe
      - name: 커밋
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          git add probe && git commit -m "조사: 공홈 번들 저장" && git push
