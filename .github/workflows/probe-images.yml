# 일회성 조사용 (실행 7):
# (Claude 클라우드 세션은 KBL 서버 접속이 차단돼 Actions 러너에서 대신 확인)
# 요청은 10회 미만, 간격 1.5초. 결과는 로그와 아티팩트(probe-images.txt)로 남긴다.
name: 이미지 출처 조사

on:
  workflow_dispatch:
  push:
    branches: [claude/probe-images]
    paths: [".github/workflows/probe-images.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 9차 조사(헤더 추가) — players API 범위(은퇴 선수 포함 여부)·필드 값 분포
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          B="https://kbl-api.sports2i.com/api/v1/players"
          q() { echo; echo "--- $1"; curl -sS --max-time 25 -A "$UA" -H "Accept: application/json" -H "Referer: https://kbl.or.kr/" -H "Origin: https://kbl.or.kr" "$1" > r.json; echo "bytes=$(wc -c < r.json)"; python3 - <<'PY'
          import json
          try:
              d=json.load(open('r.json'))
          except Exception as e:
              print('not json:', open('r.json').read()[:300]); raise SystemExit
          if isinstance(d,dict):
              print('keys=',list(d)[:8],'totalCn=',d.get('totalCn'))
              L=d.get('playerList') or d.get('data') or []
          else: L=d
          print('rows=',len(L))
          if L:
              print('fields=',list(L[0].keys()))
              from collections import Counter
              print('pos=',Counter(str(x.get('pos')) for x in L))
              print('flag2=',Counter(str(x.get('playerFlagCode2')) for x in L))
              print('teams=',Counter(str(x.get('teamCode')) for x in L).most_common(12))
              hit=[x for x in L if str(x.get('playerNo')) in ('255032','245027','215026','291248')]
              print('known=',[(x.get('playerNo'),x.get('kname'),x.get('pos'),x.get('teamCode')) for x in hit])
              print('sample=',json.dumps(L[0],ensure_ascii=False)[:300])
          PY
          sleep 1.5; }
          {
            q "$B?regSc=Y&pageNo=1&listCn=200"
            q "$B?regSc=N&pageNo=1&listCn=200"
            q "$B?pageNo=1&listCn=200"
            q "$B?regSc=N&pageNo=2&listCn=200"
            q "$B?kname=%EC%84%9C%EC%9E%A5%ED%9B%88&pageNo=1&listCn=20"
            q "$B?playerNo=255032"
            q "$B/255032"
            q "$B?regSc=N&seasonCode=13&pageNo=1&listCn=200"
          } | tee probe-images.txt
          true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-images
          path: probe-images.txt
