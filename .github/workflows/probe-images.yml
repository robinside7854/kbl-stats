# 일회성 조사용: KBL 공홈이 선수 사진·팀 로고를 어디서 가져오는지 확인한다.
# (Claude 클라우드 세션은 KBL 서버 접속이 차단돼 Actions 러너에서 대신 확인)
# 요청은 10회 미만, 간격 1.5초. 결과는 로그와 아티팩트(probe-images.txt)로 남긴다.
name: 이미지 출처 조사

on:
  workflow_dispatch:
  push:
    branches: [claude/probe-images]
    paths: [".github/workflows/probe-images.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 4차 조사 — ico.css 의 ic-emblem 규칙 전체(옛 로고 포함)
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          OUT=probe-images.txt
          {
            curl -sSL --max-time 20 -A "$UA" "https://kbl.or.kr/assets/css/ico.css" > ico.css; sleep 1.5
            echo "css bytes: $(wc -c < ico.css)"
            grep -oE '\.ic-emblem[^{]*\{[^}]*\}' ico.css
            echo "=== old/ 디렉터리 파일"
            grep -oE 'logo/old/[A-Za-z0-9_.-]+' ico.css | sort -u
            echo "=== 로고 파일 하나 실제 확인"
            curl -sS -o /dev/null -I --max-time 20 -A "$UA" -w "%{http_code} %{content_type}\n" "https://kbl.or.kr/assets/img/ico/logo/ic-sk.svg"; sleep 1.5
            curl -sS -o /dev/null -I --max-time 20 -A "$UA" -w "%{http_code} %{content_type}\n" "https://kbl.or.kr/assets/img/ico/logo/old/db1997e.png"
          } | tee "$OUT"
          true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-images
          path: probe-images.txt
