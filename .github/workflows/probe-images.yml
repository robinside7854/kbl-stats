# 일회성 조사용: KBL 공홈이 선수 사진·팀 로고를 어디서 가져오는지 확인한다.
# (Claude 클라우드 세션은 KBL 서버 접속이 차단돼 Actions 러너에서 대신 확인)
# 요청은 10회 미만, 간격 1.5초. 결과는 로그와 아티팩트(probe-images.txt)로 남긴다.
name: 이미지 출처 조사

on:
  workflow_dispatch:
  push:
    branches: [claude/probe-images]
    paths: [".github/workflows/probe-images.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 2차 조사 — 사진 URL 존재 확인, 팀 로고 경로, 번들 문맥
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          OUT=probe-images.txt
          head_of() { curl -sS -o /dev/null -I --max-time 20 -A "$UA" -w "%{http_code} %{content_type} %{size_download}B redirect=%{redirect_url}" "$1"; echo "  <- $1"; sleep 1.5; }
          {
            echo "=== A. 선수 사진 존재 여부 (현역 / 2014-15 / 1997)"
            for no in 291248 290524 215026; do
              head_of "https://kbl.or.kr/files/kbl/players-photo/$no.png"
            done

            echo; echo "=== B. 번들 문맥: players-photo 와 팀 로고 템플릿 문자열 (앞뒤 120자)"
            curl -sSL --max-time 20 -A "$UA" "https://kbl.or.kr/assets/index-BYeGquu0.js" > bundle.js; sleep 1.5
            echo "bundle bytes: $(wc -c < bundle.js)"
            grep -oE '.{0,120}players-photo.{0,120}' bundle.js | sort -u | head -8
            echo "--- teamLogoName / emblem / team-logo 문맥"
            grep -oE '.{0,120}(teamLogoName|team-logo|teamlogo|emblem|team_logo).{0,120}' bundle.js | sort -u | head -12
            echo "--- files/kbl/ 하위 경로 전체"
            grep -oE 'files/kbl/[A-Za-z0-9_./${}-]+' bundle.js | sort -u | head -40

            echo; echo "=== C. 팀 로고 후보 URL 존재 확인 (teamLogoName=sk, db)"
            for u in \
              "https://kbl.or.kr/files/kbl/team-logo/sk.png" \
              "https://kbl.or.kr/files/kbl/teams-logo/sk.png" \
              "https://kbl.or.kr/files/kbl/team/sk.png" \
              "https://kbl.or.kr/assets/img/team/sk.png" \
              "https://kbl.or.kr/assets/img/team/logo-sk.png" \
              "https://kbl.or.kr/assets/img/emblem/sk.png" \
              "https://kbl.or.kr/assets/img/logo/sk.svg"; do
              head_of "$u"
            done
          } | tee "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-images
          path: probe-images.txt
