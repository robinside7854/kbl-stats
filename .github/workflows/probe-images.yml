# 일회성 조사용 (실행 15):
# (Claude 클라우드 세션은 KBL 서버 접속이 차단돼 Actions 러너에서 대신 확인)
# 요청은 10회 미만, 간격 1.5초. 결과는 로그와 아티팩트(probe-images.txt)로 남긴다.
name: 이미지 출처 조사

on:
  workflow_dispatch:
  push:
    branches: [claude/probe-images]
    paths: [".github/workflows/probe-images.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 15차 조사(경기 기록 버튼·팀·라인업) — 선수 상세 페이지 API(경기별 기록) 캡처
        shell: bash
        run: |
          set +e
          npm init -y >/dev/null 2>&1
          npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts-probe/capture.mjs 2>&1 | tee probe-images.txt
          true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-images
          path: probe-images.txt
