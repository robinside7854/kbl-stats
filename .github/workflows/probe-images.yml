# 일회성 조사용: KBL 공홈이 선수 사진·팀 로고를 어디서 가져오는지 확인한다.
# (Claude 클라우드 세션은 KBL 서버 접속이 차단돼 Actions 러너에서 대신 확인)
# 요청은 10회 미만, 간격 1.5초. 결과는 로그와 아티팩트(probe-images.txt)로 남긴다.
name: 이미지 출처 조사

on:
  workflow_dispatch:
  push:
    branches: [claude/probe-images]
    paths: [".github/workflows/probe-images.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 3차 조사 — 사진 파일 크기(플레이스홀더 판별), CSS의 팀 엠블럼 주소, 팀코드→클래스 매핑
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          OUT=probe-images.txt
          {
            echo "=== A. 선수 사진 GET 크기·타입 (현역 워니 / 2000-01 조성원 / 2008-09 서장훈 / 2014-15 문태영 / 라건아 / 존재하지 않는 번호 999999)"
            for no in 291248 245027 255032 290280 290524 999999; do
              curl -sS -o photo_$no.bin --max-time 20 -A "$UA" -w "%{http_code} %{content_type} %{size_download}B" "https://kbl.or.kr/files/kbl/players-photo/$no.png"
              echo "  sha=$(sha256sum photo_$no.bin | cut -c1-12) dims=$(python3 -c "import struct,sys;d=open('photo_$no.bin','rb').read(32);print(struct.unpack('>II',d[16:24]) if d[:8]==b'\\x89PNG\\r\\n\\x1a\\n' else 'not-png')")  <- $no"
              sleep 1.5
            done

            echo; echo "=== B. 페이지의 CSS 파일과 그 안의 ic-emblem 규칙"
            curl -sSL --max-time 20 -A "$UA" "https://kbl.or.kr/player/list" > page.html; sleep 1.5
            grep -oE '(href|src)="[^"]+\.css[^"]*"' page.html | sort -u
            for css in $(grep -oE 'href="[^"]+\.css[^"]*"' page.html | sed 's/href="//;s/"$//' | sort -u | head -3); do
              case "$css" in http*) url="$css";; /*) url="https://kbl.or.kr$css";; *) url="https://kbl.or.kr/$css";; esac
              echo "--- $url"
              curl -sSL --max-time 20 -A "$UA" "$url" > style.css; sleep 1.5
              echo "css bytes: $(wc -c < style.css)"
              grep -oE '\.ic-emblem[^{]*\{[^}]*\}' style.css | head -40
              echo "--- css 안의 emblem/logo 이미지 경로"
              grep -oE '[A-Za-z0-9_./-]*(emblem|logo)[A-Za-z0-9_./-]*\.(png|svg|webp)' style.css | sort -u | head -40
            done

            echo; echo "=== C. 번들의 teamClassCd / getTeamEmblemClass 함수 본문"
            curl -sSL --max-time 20 -A "$UA" "https://kbl.or.kr/assets/index-BYeGquu0.js" > bundle.js; sleep 1.5
            grep -oE 'function teamClassCd\([^)]*\)\{.{0,600}' bundle.js | head -1
            echo "---"
            grep -oE '(const|function) getTeamEmblemClass[^{]*\{.{0,400}' bundle.js | head -1
            echo "---"
            grep -oE '(const|function) getTeamShortName[^{]*\{.{0,400}' bundle.js | head -1
          } | tee "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-images
          path: probe-images.txt
