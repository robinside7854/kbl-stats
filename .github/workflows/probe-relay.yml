# 조사용 1회 워크플로 — 공홈에 문자중계(경기 진행 기록)·위닝샷 데이터가 있는지 확인하고 결과를 이 브랜치에 커밋 (세션 환경은 kbl.or.kr 차단). 확인 후 삭제.
name: 문자중계 주소 조사
on:
  push:
    branches: [claude/probe-relay]
    paths: [.github/workflows/probe-relay.yml, probe/relay.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node probe/relay.mjs
      - name: 커밋
        if: always()
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          git add probe/out && git commit -m "조사: 문자중계 결과 저장" && git push
