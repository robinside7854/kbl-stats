# 조사용 워크플로 — WKBL 공홈에서 우리 KBL 대시보드처럼 기록을 받을 수 있는지 확인하고 결과를 이 브랜치에 커밋 (세션 환경은 wkbl.or.kr 차단). 확인 후 삭제.
name: WKBL 조사
on:
  push:
    branches: [claude/probe-wkbl]
    paths: [.github/workflows/probe-wkbl.yml, probe/wkbl.mjs, probe/wkbl-browser.mjs, probe/wkbl2.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node probe/wkbl.mjs
      - name: 브라우저로 데이터 주소 잡기
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/probe/wkbl-browser.mjs" /tmp/pw/ && OUT_DIR="$GITHUB_WORKSPACE/probe/wkbl/net" node /tmp/pw/wkbl-browser.mjs
      - name: 커밋
        if: always()
        run: |
          git config user.name "robinside7854"
          git config user.email "252681033+robinside7854@users.noreply.github.com"
          git add probe/wkbl && git commit -m "조사: WKBL 결과 저장" && git push
