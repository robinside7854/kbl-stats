# 조사용 (2026-10-04): TVING SPORTS 유튜브 RSS 응답을 그대로 로그(base64)로 — 10/3~10/4 하이라이트를 raw 로 넣기 위해. 조사 뒤 이 브랜치는 지워도 된다.
name: probe youtube
on:
  push:
    branches: [claude/probe-youtube]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: rss
        run: |
          curl -sS -A "kbl-stats fan project (non-commercial; github.com/robinside7854/kbl-stats)" "https://www.youtube.com/feeds/videos.xml?channel_id=UC8JtQf77wqhVpOQ8Cze8JjA" -o rss.xml
          date -u +%Y%m%dT%H%M
          grep -o '<title>[^<]*</title>' rss.xml
          echo "BEGIN_B64"; gzip -9c rss.xml | base64 -w0; echo; echo "END_B64"
