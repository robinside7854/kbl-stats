# 폰 알림 점검 (2026-10-08) — Secrets(DATABASE_URL·VAPID_PRIVATE_KEY)가 맞는지, 켠 기기에 알림이 가는지 확인할 때.
# 아래 "실행 횟수"를 1 올려 main 에 푸시하면 한 번 돈다(0 이면 아무것도 안 함). 결과는 Actions 화면 notice 한 줄.
#   테스트 알림: 예  → 켜 둔 모든 기기에 "폰 알림 테스트" 하나 (보낸 기록 안 남김)
#   테스트 알림: 아니오 → 매일 수집 뒤와 같은 새 소식 보내기
# 실행 횟수: 2
# 테스트 알림: 예
name: 폰 알림 점검

on:
  push:
    branches: [main]
    paths: [".github/workflows/push-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (판 고정, 2026-10-03 보안 점검)

      - name: 실행할지
        id: plan
        run: |
          n=$(grep -m1 '^# 실행 횟수:' .github/workflows/push-check.yml | sed 's/[^0-9]//g')
          t=$(grep -m1 '^# 테스트 알림:' .github/workflows/push-check.yml | sed 's/^# 테스트 알림:[[:space:]]*//')
          echo "run=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "test=$([ "$t" = "예" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.plan.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.plan.outputs.run == 'true'

      - name: 폰 알림
        if: steps.plan.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ "${{ steps.plan.outputs.test }}" = "true" ]; then
            npx tsx scripts/send-push.ts --test
          else
            npx tsx scripts/send-push.ts
          fi
