# 팬 숏폼(YouTube Shorts) 렌더 — 에피소드 JSON → AI 목소리 + 사진 → mp4 (scripts/build-short.ts · prepare-short.ts · shorts/)
# 영상은 사이트가 아니라 유튜브에 올린다. 업로드와 "공개" 버튼은 사람이 한다(2026-10-02 사용자 결정).
#
# 실행 방법: 아래 "실행 횟수" 숫자를 0 이 아닌 값으로 바꿔 claude/ 작업 브랜치에 푸시. 0 이면 아무것도 하지 않는다.
# (main 은 트리거에서 뺐다 — main 병합 때마다 같은 영상을 또 만들어 ElevenLabs 글자 수를 쓰지 않게. 렌더가 끝나면 0 으로 되돌린다)
# 결과:
#   - Actions 실행 화면 아래 Artifacts 에 mp4 + upload.txt(제목·설명·태그)
#   - shorts-renders 브랜치에 같은 파일 (휴대폰에서 GitHub 앱으로 받기 쉽게)
# 목소리 (저장소 Settings → Secrets and variables → Actions → Secrets):
#   ELEVENLABS_API_KEY + ELEVENLABS_VOICE_ID 가 있으면 ElevenLabs (대본 전체를 한 번에 읽힘, 권장)
#   없으면 GOOGLE_TTS_API_KEY → Google Cloud TTS, 그것도 없으면 edge-tts(키 없는 시제품용)
#   말투 조절은 Variables 에 ELEVENLABS_MODEL(기본 eleven_v3)·ELEVENLABS_STABILITY(v3 는 0·0.5·1)·SHORTS_TEMPO(빠르기, 기본 1.18)
# 작업 (아래 "작업" 줄에 공백으로): render = 영상, voices = 목소리 후보 샘플(scripts/eleven-voices.ts), bgm = 배경음악 만들기(scripts/eleven-bgm.ts)
#   배경음악은 한 번 만들면 shorts-renders 브랜치 bgm/ 에 두고 렌더마다 재사용한다
#
# 에피소드 (렌더할 것만, 공백으로): top5 = 지난 시즌 득점 TOP 5(scripts/build-short.ts), milestones = 개막전 대기록(build-short-milestones.ts),
#   quiz = 슛 차트 퀴즈(build-short-quiz.ts), flip = 순위 뒤집기(build-short-flip.ts, 전광판). 포맷마다 디자인·컴포지션이 다르다(에피소드 JSON 의 composition)
# 실행 횟수: 0
# 작업: render
# 에피소드: flip
name: 숏폼 렌더

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/shorts-render.yml"

permissions:
  contents: write

concurrency:
  group: shorts-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (판 고정, 2026-10-03 보안 점검)

      - name: 실행 횟수 확인 (0 이면 건너뜀)
        id: gate
        run: |
          n=$(grep -m1 -oE '^# 실행 횟수: [0-9]+' .github/workflows/shorts-render.yml | grep -oE '[0-9]+$' || echo 0)
          tasks=$(grep -m1 -E '^# 작업:' .github/workflows/shorts-render.yml | sed 's/^# 작업://')
          echo "작업:$tasks"
          for t in render voices bgm; do
            case " $tasks " in *" $t "*) echo "$t=true" >> "$GITHUB_OUTPUT";; *) echo "$t=false" >> "$GITHUB_OUTPUT";; esac
          done
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$n" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::실행 횟수가 0 이라 렌더하지 않습니다."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shorts/package-lock.json

      - name: 설치 (사이트 lib + 렌더러)
        if: steps.gate.outputs.run == 'true'
        env:
          HAS_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY != '' && '1' || '' }}
        run: |
          npm ci
          (cd shorts && npm ci)
          # ffprobe 는 Remotion 에 들어 있어 따로 설치하지 않는다(prepare-short durationOf). edge-tts 는 ElevenLabs 키가 없을 때만
          if [ -z "$HAS_ELEVENLABS" ]; then pip install --quiet edge-tts; fi

      - name: 배경음악 만들기 (ElevenLabs 음악)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.bgm == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npx tsx scripts/eleven-bgm.ts

      - name: 목소리 후보 샘플 (ElevenLabs Voice Library 한국어 남성)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.voices == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          SHORTS_TEMPO: ${{ vars.SHORTS_TEMPO }}
        run: npx tsx scripts/eleven-voices.ts

      - name: 현역 명단 (개막전 대기록용, 실패해도 계속)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.render == 'true'
        run: |
          eps=$(grep -m1 -E '^# 에피소드:' .github/workflows/shorts-render.yml | sed 's/^# 에피소드://')
          case " $eps " in *" milestones "*) npx tsx scripts/fetch-active.ts || echo "::warning::현역 명단을 못 받음 — 지난 시즌 명단으로 대신";; esac

      - name: 에피소드 만들기
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.render == 'true'
        run: |
          eps=$(grep -m1 -E '^# 에피소드:' .github/workflows/shorts-render.yml | sed 's/^# 에피소드://')
          : > /tmp/episodes.txt
          for e in $eps; do
            case "$e" in
              top5) script=scripts/build-short.ts ;;
              milestones) script=scripts/build-short-milestones.ts ;;
              quiz) script=scripts/build-short-quiz.ts ;;
              flip) script=scripts/build-short-flip.ts ;;
              *) echo "::error::모르는 에피소드 $e"; exit 1 ;;
            esac
            npx tsx "$script" | tee /tmp/build.log
            grep -oE 'shorts/episodes/[^ ]+/episode.json' /tmp/build.log | head -1 >> /tmp/episodes.txt
          done
          cat /tmp/episodes.txt

      - name: 배경음악 준비 (이번에 만든 것 → 없으면 shorts-renders 브랜치 bgm/sports.mp3)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.render == 'true'
        run: |
          mkdir -p shorts/public/bgm
          if [ -f shorts/out/bgm/sports-a.mp3 ]; then cp shorts/out/bgm/sports-a.mp3 shorts/public/bgm/sports.mp3;
          elif git fetch -q origin shorts-renders 2>/dev/null && git show origin/shorts-renders:bgm/sports.mp3 > shorts/public/bgm/sports.mp3 2>/dev/null; then echo "기존 배경음악 사용";
          else rm -f shorts/public/bgm/sports.mp3; echo "::notice::배경음악 없음 — 작업 줄에 bgm 을 넣어 한 번 만들 수 있습니다"; fi

      - name: 목소리·사진 준비
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.render == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'm3gJBS8OofDJfycyA2Ip' }}  # 2026-10-02 사용자 선택: 후보 02 Taehyung (ID 는 비밀이 아니라 여기에 둠, Variables 로 바꿀 수 있음)
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
          SHORTS_TEMPO: ${{ vars.SHORTS_TEMPO }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          while read -r f <&3; do npx tsx scripts/prepare-short.ts "$f"; done 3< /tmp/episodes.txt

      - name: 렌더 (1080×1920 mp4)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.render == 'true'
        run: |
          mkdir -p shorts/out
          cd shorts
          while read -r f <&3; do
            slug=$(basename "$(dirname "$f")")
            d="public/$slug/props.json"
            comp=$(node -e "console.log(require('./$d').composition || 'TopScorers')")
            echo "렌더: $slug ($comp)"
            npx remotion render src/index.ts "$comp" "out/$slug.mp4" --props="$d" --codec=h264 --crf=18 --concurrency=100% --log=warn
            cp "public/$slug/upload.txt" "out/$slug.txt"
            npx remotion ffprobe -v error -show_entries format=duration,size -of default=nw=1 "out/$slug.mp4"
          done 3< /tmp/episodes.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: shorts
          path: shorts/out/

      - name: shorts-renders 브랜치에 올리기
        if: steps.gate.outputs.run == 'true'
        run: |
          stamp=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          src=$(git rev-parse --short HEAD)
          git config user.name "kbl-stats-bot"
          git config user.email "kbl-stats-bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r shorts/out/. "$tmp/"
          if git ls-remote --exit-code --heads origin shorts-renders >/dev/null; then
            git fetch -q origin shorts-renders
            git checkout -qf -B shorts-renders origin/shorts-renders
          else
            git checkout -qf --orphan shorts-renders
            git rm -rqf --cached . >/dev/null
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            printf '숏폼 렌더 결과만 모으는 브랜치 (코드 없음, 배포 안 함)\n' > README.md
            git add README.md
          fi
          mkdir -p "$stamp"
          cp -r "$tmp"/. "$stamp/"
          git add "$stamp"
          # 새로 만든 배경음악은 렌더마다 재사용하도록 bgm/ 에도 (기본 = a)
          if [ -f "$tmp/bgm/sports-a.mp3" ]; then mkdir -p bgm && cp "$tmp"/bgm/*.mp3 bgm/ && cp bgm/sports-a.mp3 bgm/sports.mp3 && git add bgm; fi
          git commit -qm "숏폼 렌더 $stamp (소스 $src)"
          git push -q origin shorts-renders
          echo "::notice::shorts-renders 브랜치 $stamp 폴더에 올렸습니다."
