  <text x="70" y="101" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="31" letter-spacing="2" fill="#FFFFFF">KSR</text>
  <!-- 풀네임: 작게, 덜 굵게 -->
  <text x="70" y="119" text-anchor="middle" font-family="Pretendard" font-weight="400" font-size="9.2" letter-spacing="1.1" fill="#C9D3F2">KBL STATS REFERENCE</text>
