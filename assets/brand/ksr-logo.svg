<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- KSR (KBL Stats Reference) 로고 — 네이버 로그인 검수·앱 아이콘용 (2026-10-04). 리그 남색 바탕 + 주황 농구공 + KSR + 풀네임 -->
  <rect width="140" height="140" fill="#011B6A"/>
  <!-- 농구공 -->
  <g transform="translate(70 43)">
    <circle r="23" fill="#EB6100"/>
    <g fill="none" stroke="#011B6A" stroke-width="2.4" stroke-linecap="round">
      <circle r="23"/>
      <line x1="0" y1="-23" x2="0" y2="23"/>
