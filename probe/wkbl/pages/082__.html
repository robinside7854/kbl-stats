<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>WKBL 포토사이트</title>
	<link rel="stylesheet" href="../common/css/common.css" />
	<script type="text/javascript" src="../common/js/jquery-1.11.3.min.js"></script>
	<script type="text/javascript" src="../common/js/jquery-ui.js"></script>
	<script type="text/javascript" src="../common/js/jquery.easing.1.3.js"></script>
	<!--[if lt IE 9]>
	<script src="../common/js/html5shiv.js"></script>
	<![endif]-->
</head>
<body id="logwrap">

<div class="logarea">
	<h1 class="log_logo"><img src="../images/h1_logo.png" alt="WKBL PHOTO"></h1>
	<!-- Login -->
	<div class="login">
        <form id="mainForm" action="login_process.php" method="post">
			<input type="text" id="user_id" name="user_id" placeholder="아이디" autofocus>
			<input type="password" id="user_passwd" name="user_passwd" placeholder="비밀번호">
			<button type="button" onclick="doSubmit(); return false;">로그인</button>
		</form>
		<ul>
			<li>본 사이트의 이용을 위해 로그인하여 주십시오.</li>
			<li>아이디 발급 및 확인은 관리자에게 문의 주시기 바랍니다.</li>
		</ul>
	</div>
	<!-- //Login -->
</div>

<script language="javascript">
    function doSubmit() {
        var frm = document.forms.mainForm;
        if (frm.user_id.value == '') {
            alert("아이디를 입력하세요.");
            return;
        }
        if (frm.user_passwd.value == '') {
            alert("비밀번호를 입력하세요.");
            return;
        }
        frm.submit();
    }

    $(document).ready(function(){
        $('#user_id').keypress(function(e) {
            if (e.which == 13) {
                doSubmit();
            }
        });

        $('#user_passwd').keypress(function(e) {
            if (e.which == 13) {
                doSubmit();
            }
        });
    });
</script>

</body>
</html>
